# Tests run without a local MySQL server (in-memory H2, MySQL compatibility mode).
spring.datasource.url=jdbc:h2:mem:espritconnect_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.db.repair-offre-id-autoincrement=false

app.jwt.secret=EspritConnect2DevSecretKeyMustBe256BitsLongMinimumChars!!
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:4200

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

app.mail.from=test@example.com
app.mail.from-name=EspritConnect Test
app.frontend.url=http://localhost:4200
