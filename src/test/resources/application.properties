# Tests run without a local MySQL server (in-memory H2, MySQL compatibility mode).
spring.datasource.url=jdbc:h2:mem:espritconnect_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Do not activate gmail/brevo SMTP profiles during tests
spring.profiles.active=
spring.config.import=

app.db.repair-offre-id-autoincrement=false

app.jwt.secret=EspritConnect2DevSecretKeyMustBe256BitsLongMinimumChars!!
app.jwt.expiration-ms=86400000
app.jwt.mfa-pending-expiration-ms=300000
app.cors.allowed-origins=http://localhost:4200

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.debug=false

app.mail.from=test@example.com
app.mail.from-name=EspritConnect Test
app.mail.admin-notification.subject=Test - Nouvelle inscription
app.mail.admin-notification.recipients=admin@test.com
app.frontend.url=http://localhost:4200

app.email-verification.expiration-hours=24
app.email-verification.expose-link-on-register=false

app.upload.root=${java.io.tmpdir}/espritconnect-test/uploads
app.uploads.dir=${app.upload.root}
file.upload-dir=${app.upload.root}

app.verification.api.enabled=false
app.verification.api.url=
app.verification.api.key=

app.chatbot.provider=openai
app.chatbot.model=llama-3.3-70b-versatile
app.chatbot.openai-base-url=https://api.groq.com/openai/v1
app.chatbot.fallback-enabled=true
app.chatbot.temperature=0.75
app.chatbot.max-output-tokens=2048

logging.level.org.springframework.mail=WARN
logging.level.jakarta.mail=WARN
