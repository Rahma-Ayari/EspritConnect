spring.application.name=EspritConnecttest
spring.config.import=optional:classpath:application-brevo.properties,optional:classpath:application-local.properties

### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/EspritConnecttest?useUnicode=true&useJDBCCompliantTimezoneShift=true&createDatabaseIfNotExist=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

### SERVER ###
server.port=8089
server.servlet.context-path=/espritconnect

### JWT ###
app.jwt.secret=EspritConnect2DevSecretKeyMustBe256BitsLongMinimumChars!!
app.jwt.expiration-ms=86400000
app.jwt.mfa-pending-expiration-ms=300000

### CORS ###
app.cors.allowed-origins=http://localhost:4200

### MAIL (Brevo ? single provider for all emails) ###

app.mail.from-name=EspritConnect
app.mail.admin-notification.subject=Nouvelle inscription en attente d'approbation
app.mail.admin-notification.recipients=rahmaayari272@gmail.com

### FRONTEND ###
app.frontend.url=http://localhost:4200

### EMAIL VERIFICATION ###
app.email-verification.expiration-hours=24
app.email-verification.expose-link-on-register=true

### FILE UPLOAD SETTINGS ###
app.upload.root=${user.home}/EspritConnect2/uploads
app.uploads.dir=${app.upload.root}
file.upload-dir=${app.upload.root}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

### ENTERPRISE VERIFICATION SETTINGS ###
app.verification.api.enabled=false
app.verification.api.url=
app.verification.api.key=

### DEBUG MAIL LOGS ###
logging.level.org.springframework.mail=DEBUG
logging.level.jakarta.mail=DEBUG
spring.mail.properties.mail.debug=true

### OPTIONAL LOCAL SECRETS (Groq chatbot key, etc.) ? see application-local.properties.example ###

app.db.repair-offre-id-autoincrement=false

### CHATBOT AI (Groq ? OpenAI-compatible) ###
# Set GROQ_API_KEY env var, or app.chatbot.api-key in application-local.properties (see .example)
app.chatbot.provider=openai
app.chatbot.model=llama-3.3-70b-versatile
app.chatbot.openai-base-url=https://api.groq.com/openai/v1
app.chatbot.fallback-enabled=true
app.chatbot.fallback-provider=gemini
app.chatbot.fallback-model=gemini-2.0-flash-lite
app.chatbot.temperature=0.75
app.chatbot.max-output-tokens=2048
