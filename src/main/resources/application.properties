spring.application.name=EspritConnect222
# Local API key file (gitignored) — must load BEFORE any app.chatbot.api-key line in this file
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/EspritConnect222?useUnicode=true&useJDBCCompliantTimezoneShift=true&createDatabaseIfNotExist=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8088
server.servlet.context-path=/espritconnect

app.jwt.secret=EspritConnect2DevSecretKeyMustBe256BitsLongMinimumChars!!
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:4200

### Platform monitoring (Actuator) ###
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoints.web.base-path=/actuator

### Support chatbot (RAG + LLM) — keys in application-local.properties ###
# Best setup: Groq primary + Gemini fallback — see application-local.properties.example
app.chatbot.provider=gemini
app.chatbot.model=gemini-2.0-flash-lite
app.chatbot.openai-base-url=https://api.openai.com/v1
app.chatbot.fallback-enabled=true
app.chatbot.fallback-provider=openai
app.chatbot.fallback-model=llama-3.3-70b-versatile
app.chatbot.fallback-openai-base-url=https://api.groq.com/openai/v1
app.chatbot.max-faqs-context=6
app.chatbot.max-output-tokens=2048
app.chatbot.temperature=0.7
