spring.application.name=EspritConnect2

### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/EspritConnect2?useUnicode=true&useJDBCCompliantTimezoneShift=true&createDatabaseIfNotExist=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

### SERVER ###
server.port=8088
server.servlet.context-path=/espritconnect

### JWT ###
app.jwt.secret=EspritConnect2DevSecretKeyMustBe256BitsLongMinimumChars!!
app.jwt.expiration-ms=86400000
app.jwt.mfa-pending-expiration-ms=300000

### CORS ###
app.cors.allowed-origins=http://localhost:4200

### EMAIL / BREVO SMTP ###
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587

spring.mail.username=
spring.mail.password=

spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

### IMPORTANT ###
### This email MUST be verified inside Brevo ###
spring.mail.properties.mail.smtp.from=rahma.ayari@teamxtend.com

### APPLICATION EMAIL SETTINGS ###
app.mail.from=rahma.ayari@teamxtend.com
app.mail.from-name=EspritConnect

app.mail.admin-notification.subject=Nouvelle inscription en attente d'approbation

### FRONTEND ###
app.frontend.url=http://localhost:4200

### EMAIL VERIFICATION ###
app.email-verification.expiration-hours=24
app.email-verification.expose-link-on-register=true

### FILE UPLOAD SETTINGS ###
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

### ENTERPRISE VERIFICATION SETTINGS ###
app.verification.api.enabled=false
app.verification.api.url=
app.verification.api.key=

### DEBUG MAIL LOGS ###
logging.level.org.springframework.mail=DEBUG
logging.level.jakarta.mail=DEBUG
spring.mail.properties.mail.debug=true