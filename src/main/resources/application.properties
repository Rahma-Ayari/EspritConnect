spring.application.name=EspritConnect2
spring.datasource.url=jdbc:mysql://localhost:3306/EspritConnect2?useUnicode=true&useJDBCCompliantTimezoneShift=true&createDatabaseIfNotExist=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8087
server.servlet.context-path=/espritconnect

app.jwt.secret=EspritConnect2DevSecretKeyMustBe256BitsLongMinimumChars!!
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:4200

# Runs once at startup on MySQL: ALTER offre.id_offre AUTO_INCREMENT (fixes insert 500 if PK had no default). Set false to skip.
app.db.repair-offre-id-autoincrement=true
