# Brevo SMTP — never commit real keys. Set in application-local.properties or env vars.
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.from=${BREVO_MAIL_FROM:rahma.ayari@teamxtend.com}

app.mail.from=${BREVO_MAIL_FROM:rahma.ayari@teamxtend.com}
