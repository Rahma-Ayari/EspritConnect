# Brevo SMTP - used for ALL emails (admin alerts, verification, campaigns, digests).
# Never commit real keys. Override in application-local.properties or env vars.
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587

spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.from=rahma.ayari@teamxtend.com

# Verified sender shown to recipients (must match a sender validated in Brevo)
app.mail.from=rahma.ayari@teamxtend.com

# Alternative sender for optional use cases (does not override app.mail.from)
app.mail.alt-from=dorsaf.madani@esprit.tn
