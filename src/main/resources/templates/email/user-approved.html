<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte approuvé</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f4;">
    <table role="presentation" style="width: 100%; border-collapse: collapse;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table role="presentation" style="width: 600px; border-collapse: collapse; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    
                    <!-- Header -->
                    <tr>
                        <td style="padding: 30px 40px; background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%); border-radius: 8px 8px 0 0;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 600;">
                                EspritConnect
                            </h1>
                        </td>
                    </tr>
                    
                    <!-- Content -->
                    <tr>
                        <td style="padding: 40px;">
                            <div style="text-align: center; margin-bottom: 30px;">
                                <div style="display: inline-block; width: 70px; height: 70px; background-color: #d4edda; border-radius: 50%; line-height: 70px; font-size: 32px;">
                                    &#10003;
                                </div>
                            </div>
                            
                            <h2 style="margin: 0 0 20px 0; color: #333333; font-size: 22px; font-weight: 600; text-align: center;">
                                Félicitations <span th:text="${userName}">Utilisateur</span> !
                            </h2>
                            
                            <p style="margin: 0 0 25px 0; color: #666666; font-size: 15px; line-height: 1.6; text-align: center;">
                                Votre compte EspritConnect a été approuvé par un administrateur. Vous pouvez maintenant vous connecter et accéder à toutes les fonctionnalités de la plateforme.
                            </p>
                            
                            <!-- CTA Button -->
                            <table role="presentation" style="width: 100%; border-collapse: collapse;">
                                <tr>
                                    <td align="center">
                                        <a th:href="${loginUrl}" 
                                           style="display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%); color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600; border-radius: 6px; box-shadow: 0 2px 4px rgba(40,167,69,0.3);">
                                            Se connecter
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 25px 40px; background-color: #f8f9fa; border-radius: 0 0 8px 8px; border-top: 1px solid #e9ecef;">
                            <p style="margin: 0; color: #888888; font-size: 13px; line-height: 1.5; text-align: center;">
                                Cet email a été envoyé automatiquement par EspritConnect.
                            </p>
                        </td>
                    </tr>
                    
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
